name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: container-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/x2m7/zweiblog
  TCR_IMAGE_NAME: ccr.ccs.tencentyun.com/x2m7/zweiblog

jobs:
  verify:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test container configuration renderer
        run: node --test scripts/render-caddy-config.test.js

      - name: Check shell script syntax
        run: bash -n entrypoint.sh scripts/zweiblog.sh scripts/migrate-mongo.sh scripts/docker-smoke-test.sh docker-compose/setup-mongo-secrets.sh

      - name: Test server
        run: pnpm --filter @zweiblog/server exec jest --runInBand

      - name: Test admin
        run: pnpm --filter @zweiblog/admin test

      - name: Test website
        run: pnpm --filter @zweiblog/theme-default exec vitest run

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: zweiblog:release-smoke
          build-args: |
            ZWEI_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            ZWEI_BLOG_VERSIONS=smoke-${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Gate publishing on a healthy Compose deployment
        timeout-minutes: 8
        run: bash scripts/docker-smoke-test.sh zweiblog:release-smoke

  publish:
    name: Build and publish (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZWEI_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            ZWEI_BLOG_VERSIONS=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-architecture manifest
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.export.outputs.digest }}
      tags_json: ${{ steps.export.outputs.tags_json }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create \
            --metadata-file /tmp/manifest-metadata.json \
            "${tags[@]}" \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Export verified manifest identity
        id: export
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          set -Eeuo pipefail
          digest="$(
            jq -er '
              .["containerimage.descriptor"].digest |
              select(test("^sha256:[0-9a-f]{64}$"))
            ' /tmp/manifest-metadata.json
          )"
          tags_json="$(
            jq -cer '.tags | select(type == "array" and length > 0)' \
              <<< "$METADATA_JSON"
          )"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'tags_json=%s\n' "$tags_json" >> "$GITHUB_OUTPUT"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.IMAGE_NAME }}@${{ steps.export.outputs.digest }}"

  mirror-tcr:
    name: Mirror verified image to Tencent TCR
    runs-on: ubuntu-latest
    needs: merge
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_DIGEST: ${{ needs.merge.outputs.image_digest }}
      SOURCE_TAGS_JSON: ${{ needs.merge.outputs.tags_json }}
    steps:
      - name: Install registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Log in to container registries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$TCR_USERNAME" || -z "$TCR_PASSWORD" ]]; then
            echo "::error::TCR_USERNAME and TCR_PASSWORD repository secrets are required"
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          printf '%s' "$TCR_PASSWORD" | skopeo login --username "$TCR_USERNAME" --password-stdin ccr.ccs.tencentyun.com

      - name: Copy, verify, and promote image tags
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid source image digest"
            exit 1
          fi
          if ! jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "string")
          ' <<< "$SOURCE_TAGS_JSON" >/dev/null; then
            echo "::error::Invalid source image tag metadata"
            exit 1
          fi

          source_ref="${IMAGE_NAME}@${SOURCE_DIGEST}"
          source_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${source_ref}")"
          if [[ "$source_digest" != "$SOURCE_DIGEST" ]]; then
            echo "::error::GHCR source digest changed unexpectedly"
            exit 1
          fi

          manifest_json="$(skopeo inspect --raw "docker://${source_ref}")"
          jq -e '
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
          ' <<< "$manifest_json" >/dev/null || {
            echo "::error::GHCR image is missing the linux/amd64 or linux/arm64 manifest"
            exit 1
          }

          promote_tag() {
            local tag="$1"
            local destination_ref="${TCR_IMAGE_NAME}:${tag}"
            skopeo copy --all --preserve-digests --retry-times 5 \
              "docker://${source_ref}" \
              "docker://${destination_ref}"
            local promoted_digest
            promoted_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${destination_ref}")"
            if [[ "$promoted_digest" != "$source_digest" ]]; then
              echo "::error::TCR tag ${tag} does not match the verified image digest"
              exit 1
            fi
          }

          mapfile -t published_tags < <(
            jq -r --arg image "$IMAGE_NAME" \
              '.[] | select(startswith($image + ":")) | ltrimstr($image + ":")' \
              <<< "$SOURCE_TAGS_JSON"
          )

          if [[ "${#published_tags[@]}" -eq 0 ]]; then
            echo "::error::No image tags are available for Tencent TCR"
            exit 1
          fi
          source_tag_count="$(jq 'length' <<< "$SOURCE_TAGS_JSON")"
          if [[ "${#published_tags[@]}" -ne "$source_tag_count" ]]; then
            echo "::error::Unexpected image name in published tag metadata"
            exit 1
          fi

          for tag in "${published_tags[@]}"; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid container image tag: ${tag}"
              exit 1
            fi
            case "$tag" in
              main|latest) continue ;;
            esac
            promote_tag "$tag"
          done

          for mutable_tag in main latest; do
            for tag in "${published_tags[@]}"; do
              if [[ "$tag" == "$mutable_tag" ]]; then
                promote_tag "$tag"
                break
              fi
            done
          done

      - name: Log out of container registries
        if: always()
        run: |
          skopeo logout ccr.ccs.tencentyun.com || true
          skopeo logout ghcr.io || true

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mirror-tcr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
