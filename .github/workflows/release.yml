name: Publish container image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: container-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/x2m7/zweiblog
  TCR_IMAGE_NAME: ccr.ccs.tencentyun.com/x2m7/zweiblog

jobs:
  verify:
    name: Run test suite
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app-version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve and validate ZweiBlog application version
        id: app-version
        shell: bash
        run: |
          set -Eeuo pipefail
          app_version="$(node scripts/resolve-app-version.js)"
          echo "Application version: ${app_version}"
          echo "value=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release helpers and container configuration renderer
        run: node --test scripts/resolve-app-version.test.js scripts/release-version-chain.test.js scripts/render-caddy-config.test.js

      - name: Check shell script syntax
        run: bash -n entrypoint.sh scripts/zweiblog.sh scripts/migrate-mongo.sh scripts/docker-smoke-test.sh docker-compose/setup-mongo-secrets.sh

      - name: Test server
        run: pnpm --filter @zweiblog/server exec jest --runInBand

      - name: Test admin
        run: pnpm --filter @zweiblog/admin test

      - name: Test website
        run: pnpm --filter @zweiblog/theme-default exec vitest run

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: zweiblog:release-smoke
          build-args: |
            ZWEI_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            ZWEI_BLOG_VERSIONS=${{ steps.app-version.outputs.value }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Gate publishing on a healthy Compose deployment
        timeout-minutes: 8
        run: bash scripts/docker-smoke-test.sh zweiblog:release-smoke

  publish:
    name: Build and publish to both registries (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push platform image to both registries
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.TCR_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZWEI_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            ZWEI_BLOG_VERSIONS=${{ needs.verify.outputs.app_version }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          provenance: mode=max
          sbom: true

      - name: Verify platform digest in both registries
        env:
          PLATFORM_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$PLATFORM_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid platform image digest"
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE_NAME}@${PLATFORM_DIGEST}" >/dev/null
          docker buildx imagetools inspect "${TCR_IMAGE_NAME}@${PLATFORM_DIGEST}" >/dev/null

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish and verify multi-architecture manifests
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create matching manifest lists in both registries
        id: manifests
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t digest_files < <(
            find . -maxdepth 1 -type f -printf '%f\n' | sort
          )
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "::error::Expected exactly two platform digests"
            exit 1
          fi

          ghcr_sources=()
          tcr_sources=()
          for digest_hex in "${digest_files[@]}"; do
            if [[ ! "$digest_hex" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid platform digest: ${digest_hex}"
              exit 1
            fi
            ghcr_sources+=("${IMAGE_NAME}@sha256:${digest_hex}")
            tcr_sources+=("${TCR_IMAGE_NAME}@sha256:${digest_hex}")
          done

          mapfile -t published_refs < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          if [[ "${#published_refs[@]}" -eq 0 ]]; then
            echo "::error::No image tags were generated"
            exit 1
          fi

          ghcr_tags=()
          tcr_tags=()
          source_prefix="${IMAGE_NAME}:"
          for source_ref in "${published_refs[@]}"; do
            if [[ "$source_ref" != "$source_prefix"* ]]; then
              echo "::error::Unexpected image reference: ${source_ref}"
              exit 1
            fi
            tag="${source_ref#"$source_prefix"}"
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid container image tag: ${tag}"
              exit 1
            fi
            ghcr_tags+=(--tag "$source_ref")
            tcr_tags+=(--tag "${TCR_IMAGE_NAME}:${tag}")
          done

          docker buildx imagetools create \
            --metadata-file /tmp/ghcr-manifest.json \
            "${ghcr_tags[@]}" \
            "${ghcr_sources[@]}"
          docker buildx imagetools create \
            --metadata-file /tmp/tcr-manifest.json \
            "${tcr_tags[@]}" \
            "${tcr_sources[@]}"

          ghcr_digest="$(
            jq -er '
              .["containerimage.descriptor"].digest |
              select(test("^sha256:[0-9a-f]{64}$"))
            ' /tmp/ghcr-manifest.json
          )"
          tcr_digest="$(
            jq -er '
              .["containerimage.descriptor"].digest |
              select(test("^sha256:[0-9a-f]{64}$"))
            ' /tmp/tcr-manifest.json
          )"
          if [[ "$ghcr_digest" != "$tcr_digest" ]]; then
            echo "::error::GHCR and Tencent TCR manifest digests differ"
            exit 1
          fi
          printf 'digest=%s\n' "$ghcr_digest" >> "$GITHUB_OUTPUT"

      - name: Verify both registries expose the same multi-architecture image
        env:
          MANIFEST_DIGEST: ${{ steps.manifests.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid multi-architecture manifest digest"
            exit 1
          fi

          for image_name in "$IMAGE_NAME" "$TCR_IMAGE_NAME"; do
            manifest_json="$(
              docker buildx imagetools inspect \
                "${image_name}@${MANIFEST_DIGEST}" \
                --format '{{json .Manifest}}'
            )"
            observed_digest="$(jq -er '.digest' <<< "$manifest_json")"
            if [[ "$observed_digest" != "$MANIFEST_DIGEST" ]]; then
              echo "::error::${image_name} returned an unexpected manifest digest"
              exit 1
            fi
            if ! jq -e '
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' <<< "$manifest_json" >/dev/null; then
              echo "::error::${image_name} is missing linux/amd64 or linux/arm64"
              exit 1
            fi
          done

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
