name: Check container build

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint.sh
      - caddyTemplate.json
      - scripts/**
      - docker-compose/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - tsconfig.base.json
      - packages/admin/**
      - packages/cli/**
      - packages/server/**
      - packages/website/**
      - .github/workflows/docker-check.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Run test suite and production dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve and validate ZweiBlog application version
        run: node scripts/resolve-app-version.js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release, container, operations, and PicGo helpers
        run: >-
          node --test
          scripts/resolve-app-version.test.js
          scripts/release-version-chain.test.js
          scripts/render-caddy-config.test.js
          scripts/zweiblog-ops.test.cjs
          scripts/picgo-runtime.test.cjs
          scripts/request-parser-runtime.test.cjs

      - name: Check shell script syntax
        run: bash -n entrypoint.sh scripts/zweiblog.sh scripts/migrate-mongo.sh scripts/docker-smoke-test.sh docker-compose/setup-mongo-secrets.sh

      - name: Test server including real MongoDB integration
        env:
          ZWEIBLOG_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: pnpm --filter @zweiblog/server exec jest --runInBand

      - name: Test admin
        run: pnpm --filter @zweiblog/admin test

      - name: Test website
        run: pnpm --filter @zweiblog/theme-default exec vitest run

      - name: Audit production dependencies
        run: pnpm audit --prod

  build:
    name: Build and smoke-test (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: zweiblog:smoke
          build-args: |
            ZWEI_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            ZWEI_BLOG_VERSIONS=check-${{ github.sha }}
          cache-from: type=gha,scope=docker-check-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-check-${{ matrix.suffix }}

      - name: Smoke-test the running Compose deployment
        timeout-minutes: 8
        run: bash scripts/docker-smoke-test.sh zweiblog:smoke
