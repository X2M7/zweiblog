name: Check container build

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint.sh
      - caddyTemplate.json
      - scripts/start.js
      - scripts/render-caddy-config.js
      - scripts/render-caddy-config.test.js
      - docker-compose/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/admin/**
      - packages/cli/**
      - packages/server/**
      - packages/website/**
      - .github/workflows/docker-check.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test container configuration renderer
        run: node --test scripts/render-caddy-config.test.js

      - name: Check shell script syntax
        run: bash -n entrypoint.sh scripts/zweiblog.sh scripts/migrate-mongo.sh docker-compose/setup-mongo-secrets.sh

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            ZWEI_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            ZWEI_BLOG_VERSIONS=check-${{ github.sha }}
          cache-from: type=gha,scope=docker-check
          cache-to: type=gha,mode=max,scope=docker-check
