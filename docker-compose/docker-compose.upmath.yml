# Optional local LaTeX/Upmath renderer. This file is intentionally not included
# by docker-compose.yml, so the default ZweiBlog deployment remains unchanged.
services:
  upmath:
    # Pin the reviewed amd64 image by digest. Override deliberately after
    # reviewing a newer image instead of silently following a mutable tag.
    image: ${ZWEIBLOG_UPMATH_IMAGE:-ghcr.io/x2m7/i.upmath.me@sha256:46a18b7758e40a5db258a1b8bf74d302269d2835f90498e760e0dc4ada8caf6b}
    restart: unless-stopped
    init: true
    ports:
      # The host Nginx is the only intended caller. Do not publish this service
      # on 0.0.0.0: it compiles untrusted LaTeX and must not bypass rate limits.
      - ${ZWEIBLOG_UPMATH_BIND:-127.0.0.1}:${ZWEIBLOG_UPMATH_PORT:-8081}:80
    networks:
      - upmath
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ZWEIBLOG_UPMATH_MEMORY_LIMIT:-2g}
    cpus: ${ZWEIBLOG_UPMATH_CPUS:-2.0}
    pids_limit: ${ZWEIBLOG_UPMATH_PIDS_LIMIT:-256}
    # Upmath stores every distinct successful/failed formula and its internal
    # logs inside the container. Bound all writable hot paths so public input
    # cannot grow Docker's overlay filesystem until the host disk is full.
    tmpfs:
      - /var/www/i.upmath.me/tmp:size=${ZWEIBLOG_UPMATH_TMP_SIZE:-256m},mode=1777,nosuid,nodev
      - /var/www/i.upmath.me/www/_cache:size=${ZWEIBLOG_UPMATH_CACHE_SIZE:-256m},mode=0755,nosuid,nodev
      - /var/www/i.upmath.me/www/_error:size=${ZWEIBLOG_UPMATH_ERROR_CACHE_SIZE:-16m},mode=0755,nosuid,nodev
      - /var/www/i.upmath.me/tex_logs:size=${ZWEIBLOG_UPMATH_TEX_LOG_SIZE:-32m},mode=0755,nosuid,nodev
      - /var/www/i.upmath.me/logs:size=${ZWEIBLOG_UPMATH_INTERNAL_LOG_SIZE:-32m},mode=0755,nosuid,nodev
      - /var/log/nginx:size=16m,mode=0755,nosuid,nodev
      - /tmp:size=128m,mode=1777,nosuid,nodev
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(strpos((string) @file_get_contents("http://127.0.0.1/svg/x%5E2"), "<svg") === false ? 1 : 0);'
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: ${ZWEIBLOG_LOG_MAX_SIZE:-10m}
        max-file: ${ZWEIBLOG_LOG_MAX_FILES:-3}

networks:
  upmath:
    driver: bridge
    # Formula compilation has no runtime Internet dependency. Keep the
    # renderer from initiating outbound connections if TeX input finds an
    # unexpected code-execution path; the loopback-published host port remains
    # the only intended ingress.
    internal: true
