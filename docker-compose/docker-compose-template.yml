services:
  zweiblog:
    image: zweiblog_image
    restart: unless-stopped
    init: true
    environment:
      TZ: 'Asia/Shanghai'
      # Email address used by Caddy when requesting HTTPS certificates.
      EMAIL: zweiblog_email
      ZWEI_BLOG_DATABASE_URL_FILE: /run/secrets/mongo_app_uri
      ZWEI_BLOG_HOST: 127.0.0.1
      ZWEI_BLOG_TRUST_PROXY: loopback
      ZWEI_BLOG_CADDY_TRUSTED_PROXIES: ''
      ZWEI_BLOG_PIPELINE_ALLOW_UNSAFE_EXECUTION: 'false'
      ZWEI_BLOG_PICGO_ALLOW_UNSAFE_PLUGIN_INSTALL: 'false'
    volumes:
      - zweiblog_data_path/data/static:/app/static
      - zweiblog_data_path/log:/var/log
      - zweiblog_data_path/caddy/config:/home/zweiblog/.config/caddy
      - zweiblog_data_path/caddy/data:/home/zweiblog/.local/share/caddy
    ports:
      - 'zweiblog_http_port:80'
      - 'zweiblog_https_port:443'
    secrets:
      - mongo_app_uri
    networks:
      - web
      - database
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all(['http://127.0.0.1:3000/','http://127.0.0.1:3001/','http://127.0.0.1/'].map((url)=>fetch(url,{redirect:'manual'}))).then((responses)=>process.exit(responses.every((response)=>response.status<500)?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  mongo:
    # Existing MongoDB 4.4 data must be migrated; never upgrade its data files
    # directly to 8.0.
    image: mongo:8.0
    restart: unless-stopped
    environment:
      TZ: 'Asia/Shanghai'
      MONGO_INITDB_ROOT_USERNAME: zweiblog-root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - zweiblog_data_path/data/mongo:/data/db
      - zweiblog_data_path/mongo-init.js:/docker-entrypoint-initdb.d/10-zweiblog-user.js:ro
      - zweiblog_data_path/mongo-healthcheck.js:/opt/zweiblog/mongo-healthcheck.js:ro
    secrets:
      - mongo_root_password
      - mongo_app_password
      - mongo_app_uri
    networks:
      - database
    healthcheck:
      test: ['CMD', 'mongosh', '--nodb', '--quiet', '--file', '/opt/zweiblog/mongo-healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

secrets:
  mongo_root_password:
    file: zweiblog_data_path/secrets/mongo-root-password
  mongo_app_password:
    file: zweiblog_data_path/secrets/mongo-app-password
  mongo_app_uri:
    file: zweiblog_data_path/secrets/mongo-app-uri

networks:
  web:
    driver: bridge
  database:
    driver: bridge
    internal: true
