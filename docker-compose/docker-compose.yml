services:
  zweiblog:
    # Build this zweiblog checkout. Pulling the upstream image here would not
    # include the native local-comment and security changes in this project.
    image: zweiblog:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        ZWEI_BLOG_VERSIONS: zweiblog-local
    restart: unless-stopped
    environment:
      TZ: 'Asia/Shanghai'
      # Email address used by Caddy when requesting HTTPS certificates.
      EMAIL: 'someone@example.com'
      # The URI is read from a Docker secret instead of being exposed by
      # `docker inspect` as an environment variable.
      ZWEI_BLOG_DATABASE_URL_FILE: /run/secrets/mongo_app_uri
    volumes:
      - ${PWD}/data/static:/app/static
      - ${PWD}/log:/var/log
      - ${PWD}/caddy/config:/home/zweiblog/.config/caddy
      - ${PWD}/caddy/data:/home/zweiblog/.local/share/caddy
    ports:
      - '80:80'
      - '443:443'
    secrets:
      - mongo_app_uri
    networks:
      - web
      - database
    depends_on:
      mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  mongo:
    # MongoDB 8.0 is a supported major release. Do not point this image at a
    # MongoDB 4.4 data directory; use scripts/migrate-mongo.sh instead.
    image: mongo:8.0
    restart: unless-stopped
    environment:
      TZ: 'Asia/Shanghai'
      MONGO_INITDB_ROOT_USERNAME: zweiblog-root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - ${PWD}/data/mongo:/data/db
      - ${PWD}/mongo-init.js:/docker-entrypoint-initdb.d/10-zweiblog-user.js:ro
      - ${PWD}/mongo-healthcheck.js:/opt/zweiblog/mongo-healthcheck.js:ro
    secrets:
      - mongo_root_password
      - mongo_app_password
      - mongo_app_uri
    networks:
      - database
    healthcheck:
      test: ['CMD', 'mongosh', '--nodb', '--quiet', '--file', '/opt/zweiblog/mongo-healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

secrets:
  mongo_root_password:
    file: ${PWD}/secrets/mongo-root-password
  mongo_app_password:
    file: ${PWD}/secrets/mongo-app-password
  mongo_app_uri:
    file: ${PWD}/secrets/mongo-app-uri

networks:
  web:
    driver: bridge
  database:
    driver: bridge
    internal: true
